<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
    <h2>Registration</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    {% for message in messages %}
      <p style="color: green;">{{ message }}</p>
    {% endfor %}

    <a href="/auth/login">Уже есть аккаунт</a>

</body>
</html>
