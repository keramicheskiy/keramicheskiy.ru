<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
</head>
<body>
    <h2>Log in</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    {% for message in messages %}
      <p style="color: green;">{{ message }}</p>
    {% endfor %}


    <a href="/auth/register">Создать учётную запись</a>

</body>
</html>
