version: '3.8'

services:
  backend:
    build: ./backend
    container_name: keramicheskiy-backend
    ports:
      - "8080:8080"
    networks:
      - nginx_network
    environment:
      - ENVIRONMENT_FILE=.env.local
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
#    entrypoint: /entrypoint.sh
    command: >
      bash -c "celery -A backend worker --loglevel=info &
      gunicorn backend.wsgi:application --bind 0.0.0.0:8080 --timeout 120"

  frontend:
    build: ./frontend
    container_name: keramicheskiy-frontend
    ports:
      - "8000:8000"
    volumes:
      - static-data/keramicheskiy-frontend/:/frontend/static
    networks:
      - nginx_network
    environment:
      - ENVIRONMENT_FILE=.env.local
    depends_on:
      - backend
    entrypoint: /entrypoint.sh
    command: >
      bash -c "gunicorn frontend.wsgi:application --bind 0.0.0.0:8000 --timeout 120"


  redis:
    image: redis:7-alpine
    container_name: keramicheskiy-redis
    networks:
      - nginx_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3

volumes:
  static-data:
    external: true

networks:
  nginx_network:
    external: true